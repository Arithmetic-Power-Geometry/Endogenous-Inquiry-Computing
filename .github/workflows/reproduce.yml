name: reproduce-eic
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q
      - run: python scripts/run_experiments.py
      - uses: actions/upload-artifact@v4
        with:
          name: eic-results
          path: results/
